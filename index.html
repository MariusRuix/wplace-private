<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PixelMap</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
  #map { position: absolute; inset: 0; cursor: crosshair; }
  #pixels { position: absolute; inset: 0; pointer-events: none; z-index: 450; }
  .panel {
    position: absolute; z-index: 1000; background: #fff; border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,.25); padding: 10px;
  }
  #bar {
    left: 50%; bottom: 16px; transform: translateX(-50%);
    display: flex; flex-direction: column; gap: 8px; max-width: calc(100vw - 32px);
  }
  #palette { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; }
  .sw { width: 26px; height: 26px; border-radius: 6px; border: 2px solid #ddd; cursor: pointer; padding: 0; }
  .sw.sel { border-color: #111; transform: scale(1.12); }
  .sw.erase { background: repeating-conic-gradient(#ccc 0 25%, #fff 0 50%) 0 0/10px 10px; }
  .sw.tool { background: #f6f6f6; display: grid; place-items: center; }
  .sw.tool.on { background: #111; color: #fff; border-color: #111; }
  .sw.custom { border-style: dashed; border-color: #999; }
  .sw.custom.sel { border-style: solid; border-color: #111; }
  .sep { width: 1px; background: #ddd; margin: 0 2px; }
  #map.picking { cursor: copy; }
  #map.filling { cursor: cell; }
  #info { font-size: 12px; color: #555; text-align: center; }
  #pend {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px;
    background: #fff4d6; border: 1px solid #f0c75e; border-radius: 8px; padding: 6px 8px; font-size: 13px;
  }
  #pend[hidden] { display: none; }
  #pend button { padding: 5px 10px; border-radius: 6px; border: 1px solid #ccc; background: #fff; cursor: pointer; }
  #pend #pendOk { background: #1a7f37; border-color: #1a7f37; color: #fff; font-weight: 600; }
  #pend button:disabled { opacity: .5; cursor: default; }
  #pend label { color: #555; }

  #tpl { top: 12px; right: 12px; width: 230px; font-size: 13px; max-width: calc(100vw - 80px); }
  #tpl summary { font-weight: 600; cursor: pointer; }
  #tpl .row { display: flex; align-items: center; gap: 6px; margin-top: 8px; }
  #tpl .row label { flex: 0 0 64px; color: #555; }
  #tpl input[type=number] { width: 70px; }
  #tpl input[type=range] { flex: 1; }
  #tpl button { flex: 1; padding: 5px; border: 1px solid #ccc; border-radius: 6px; background: #f6f6f6; cursor: pointer; }
  #tpl button.on { background: #111; color: #fff; border-color: #111; }
  #tpl .hint { font-size: 11px; color: #777; margin-top: 6px; }
  #tpl .needs { display: none; }
  #tpl.has .needs { display: block; }
  #tpl.has .row.needs { display: flex; }
</style>
</head>
<body>
<div id="map"></div>
<canvas id="pixels"></canvas>

<details id="tpl" class="panel" open>
  <summary>Plantilla</summary>
  <div class="row"><input type="file" id="tplFile" accept="image/*"></div>
  <div class="row needs"><label>Ancho</label><input type="number" id="tplW" min="1" max="2000"> <span id="tplH" style="color:#777"></span></div>
  <div class="row needs"><label>Opacidad</label><input type="range" id="tplOp" min="0" max="1" step="0.05"></div>
  <div class="row needs">
    <button id="tplMove" title="Clic en el mapa para colocar la esquina superior izquierda">Mover</button>
    <button id="tplShow">Ocultar</button>
    <button id="tplDel">Quitar</button>
  </div>
  <div class="row needs"><label style="flex:1"><input type="checkbox" id="tplUse"> Pintar con los colores de la plantilla</label></div>
  <div class="row needs">
    <label>Bote</label>
    <select id="fillMode" style="flex:1">
      <option value="clasico">Área cerrada (lo pintado)</option>
      <option value="plantilla">Color de la plantilla</option>
    </select>
  </div>
  <div class="row needs">
    <label style="flex:1"><input type="checkbox" id="tplMiss"> Ver faltantes</label>
    <button id="tplNext" style="flex:0 0 auto" title="Centrar el mapa en el siguiente pixel que falta">Ir a faltante</button>
  </div>
  <div class="row needs">
    <button id="tplAuto" title="Agrega como nuevos todos los pixeles que faltan, con los colores de la plantilla (luego hay que confirmar)">Pintar todo automático</button>
  </div>
  <div class="hint needs" id="tplProg"></div>
  <div class="hint needs">Cada pixel de la imagen = 1 pixel del mapa.</div>
</details>

<div id="bar" class="panel">
  <div id="pend" hidden>
    <span id="pendTxt"></span>
    <label title="Atenua lo guardado y la plantilla para ver solo lo nuevo"><input type="checkbox" id="pendHi"> Resaltar</label>
    <button id="pendNo" title="Quitar todos los pixeles nuevos">Descartar</button>
    <button id="pendOk" title="Guardar los pixeles nuevos en el servidor (Enter)">Confirmar</button>
  </div>
  <div id="palette"></div>
  <div id="info">Acercate para pintar</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
// ---- Configuracion ----
const Z = 13;            // zoom de la cuadricula (13 = ~19 m por pixel en el ecuador)
const MIN_VIEW = 9;      // zoom minimo para mostrar pixeles
const MIN_PAINT = 15;    // zoom minimo para pintar (cada pixel = 4 px en pantalla)
const API = 'api.php';
const TPL_KEY = 'pixelmap-template';
const COLORS = ['#000000','#3c3c3c','#787878','#d2d2d2','#ffffff','#600018','#ed1c24','#ff7f27',
  '#f6aa09','#f9dd3b','#fffabc','#0eb968','#13e67b','#87ff5e','#0c816e','#10aea6','#13e1be',
  '#28509e','#4093e4','#60f7f2','#6b50f6','#99b1fb','#780c99','#aa38b9','#e09ff9','#cb007a',
  '#ec1f80','#f38da9','#684634','#95682a','#f8b277', null];

// ---- Estado ----
const pixels = new Map();          // "x,y" -> color
let color = COLORS[6];
let hover = null;
let spaceDown = false;   // Espacio presionado = modo pintar al mover
let lastCell = null;     // ultimo pixel del trazo
let asking = false;      // evita pedir la contrasena varias veces
let picking = false;     // cuentagotas activo
const CUSTOM_KEY = 'pixelmap-custom';
let customColors = [];   // colores tomados con el cuentagotas
try { customColors = JSON.parse(localStorage.getItem(CUSTOM_KEY) || '[]'); } catch (e) {}

// Plantilla: imagen original + version reescalada (1 px = 1 pixel del mapa)
const tpl = { src: null, img: null, canvas: null, data: null, x: 0, y: 0, w: 0, h: 0,
              opacity: 0.5, visible: true, placing: false, use: false,
              hex: null, showMissing: false, missCanvas: null, missMask: null, lum: null, lastGo: null };

// ---- Mapa ----
const map = L.map('map', { worldCopyJump: true }).setView([19.4326, -99.1332], 16);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19, attribution: '&copy; OpenStreetMap'
}).addTo(map);

const canvas = document.getElementById('pixels');
const ctx = canvas.getContext('2d');

function resize() {
  const s = map.getSize(), dpr = devicePixelRatio || 1;
  canvas.width = s.x * dpr; canvas.height = s.y * dpr;
  canvas.style.width = s.x + 'px'; canvas.style.height = s.y + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  draw();
}

function tplPos() {
  // mientras se mueve, la plantilla sigue al cursor
  return tpl.placing && hover ? hover : { x: tpl.x, y: tpl.y };
}

function draw() {
  computeProgress();
  const s = map.getSize();
  ctx.clearRect(0, 0, s.x, s.y);
  if (map.getZoom() < MIN_VIEW) return;
  const scale = Math.pow(2, map.getZoom() - Z);
  const o = map.getPixelBounds().min;
  const size = Math.max(scale, 1);

  // Pixeles guardados (atenuados si se esta resaltando lo nuevo)
  if (highlightNew) ctx.globalAlpha = 0.2;
  for (const [k, c] of pixels) {
    if (pending.has(k)) continue;
    const i = k.indexOf(',');
    const sx = k.slice(0, i) * scale - o.x, sy = k.slice(i + 1) * scale - o.y;
    if (sx < -size || sy < -size || sx > s.x || sy > s.y) continue;
    ctx.fillStyle = c;
    ctx.fillRect(sx, sy, size, size);
  }
  ctx.globalAlpha = 1;

  // Pixeles nuevos (sin confirmar)
  const pendVisible = [];
  for (const [k, c] of pending) {
    const i = k.indexOf(',');
    const sx = k.slice(0, i) * scale - o.x, sy = k.slice(i + 1) * scale - o.y;
    if (sx < -size || sy < -size || sx > s.x || sy > s.y) continue;
    if (c) { ctx.fillStyle = c; ctx.fillRect(sx, sy, size, size); }
    pendVisible.push(sx, sy, c ? 1 : 0);
  }

  // Plantilla ENCIMA de los pixeles pintados (asi Alt / Ocultar siempre se nota).
  // En "ver faltantes" se dibuja tenue, como referencia, y los faltantes resaltados encima.
  if (tpl.canvas && (tpl.visible || tpl.placing) && (!highlightNew || tpl.placing)) {
    const p = tplPos();
    const missMode = tpl.showMissing && !tpl.placing;
    ctx.save();
    ctx.globalAlpha = tpl.placing ? Math.max(tpl.opacity, 0.6)
                    : missMode ? Math.min(tpl.opacity, 0.3) : tpl.opacity;
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(tpl.canvas, p.x * scale - o.x, p.y * scale - o.y, tpl.w * scale, tpl.h * scale);
    ctx.restore();
    ctx.lineWidth = tpl.placing ? 2 : 1;
    ctx.strokeStyle = tpl.placing ? '#1a73e8' : missMode ? '#e8711a' : 'rgba(26,115,232,.6)';
    ctx.setLineDash(tpl.placing ? [6, 4] : [4, 3]);
    ctx.strokeRect(p.x * scale - o.x - .5, p.y * scale - o.y - .5, tpl.w * scale + 1, tpl.h * scale + 1);
    ctx.setLineDash([]);
  }

  // Modo "ver faltantes": solo los pixeles que faltan o estan mal, resaltados
  if (tpl.showMissing && tpl.missCanvas && tpl.visible && !tpl.placing && !highlightNew) {
    const ox = tpl.x * scale - o.x, oy = tpl.y * scale - o.y;
    ctx.save();
    ctx.imageSmoothingEnabled = false;
    ctx.globalAlpha = Math.max(tpl.opacity, 0.7);
    ctx.drawImage(tpl.missCanvas, ox, oy, tpl.w * scale, tpl.h * scale);
    ctx.restore();
    // marca cada faltante con un punto (solo si se ve lo bastante grande)
    if (scale >= 4) {
      const x0 = Math.max(0, Math.floor(-ox / scale)), x1 = Math.min(tpl.w, Math.ceil((s.x - ox) / scale));
      const y0 = Math.max(0, Math.floor(-oy / scale)), y1 = Math.min(tpl.h, Math.ceil((s.y - oy) / scale));
      const d = Math.max(2, Math.round(scale / 4)), off = (scale - d) / 2;
      for (let y = y0; y < y1; y++) for (let x = x0; x < x1; x++) {
        const j = y * tpl.w + x;
        if (!tpl.missMask[j]) continue;
        ctx.fillStyle = tpl.lum[j] > 140 ? 'rgba(0,0,0,.6)' : 'rgba(255,255,255,.8)';
        ctx.fillRect(ox + x * scale + off, oy + y * scale + off, d, d);
      }
    }
  }
  // Marca de "nuevo": borde blanco/negro en cada pixel sin confirmar (X roja = se borrara)
  if (scale >= 4) {
    ctx.lineWidth = 1;
    for (let i = 0; i < pendVisible.length; i += 3) {
      const sx = pendVisible[i], sy = pendVisible[i + 1];
      if (pendVisible[i + 2]) {
        ctx.strokeStyle = 'rgba(255,255,255,.95)';
        ctx.strokeRect(sx + .5, sy + .5, size - 1, size - 1);
        if (size >= 7) { ctx.strokeStyle = 'rgba(0,0,0,.8)'; ctx.strokeRect(sx + 1.5, sy + 1.5, size - 3, size - 3); }
      } else {
        ctx.strokeStyle = '#e02020';
        ctx.beginPath();
        ctx.moveTo(sx + 1, sy + 1); ctx.lineTo(sx + size - 1, sy + size - 1);
        ctx.moveTo(sx + size - 1, sy + 1); ctx.lineTo(sx + 1, sy + size - 1);
        ctx.stroke();
      }
    }
  }

  // Vista previa del bote: el area que se rellenaria, con el color que quedaria
  if (filling && hover && !fillBusy && map.getZoom() >= MIN_PAINT) {
    const reg = computeRegion(hover);
    if (reg && reg.list.length) {
      ctx.save();
      ctx.imageSmoothingEnabled = false;
      ctx.globalAlpha = 0.6;
      ctx.drawImage(reg.canvas, tpl.x * scale - o.x, tpl.y * scale - o.y, tpl.w * scale, tpl.h * scale);
      ctx.restore();
    }
  }
  if (hover && map.getZoom() >= MIN_PAINT && !tpl.placing) {
    ctx.strokeStyle = '#000'; ctx.lineWidth = 1;
    ctx.strokeRect(hover.x * scale - o.x + .5, hover.y * scale - o.y + .5, size - 1, size - 1);
  }
}

function toCell(latlng) {
  const p = map.project(latlng, Z).floor();
  return { x: p.x, y: p.y };
}

async function fetchArea(x1, y1, x2, y2) {
  try {
    const r = await fetch(`${API}?x1=${x1}&y1=${y1}&x2=${x2}&y2=${y2}`);
    const data = await r.json();
    for (const [x, y, col] of data) pixels.set(x + ',' + y, col);
    pxVer++;
    draw();
  } catch (e) { setInfo('No se pudo cargar: ' + e.message); }
}

function load() {
  if (map.getZoom() < MIN_VIEW) { draw(); return; }
  const b = map.getBounds();
  const a = map.project(b.getNorthWest(), Z).floor();
  const c = map.project(b.getSouthEast(), Z).floor();
  fetchArea(a.x, a.y, c.x, c.y);
}

// Carga los pixeles de toda la plantilla (para contar el progreso aunque no este en pantalla)
function loadTplArea() {
  if (tpl.data) return fetchArea(tpl.x, tpl.y, tpl.x + tpl.w - 1, tpl.y + tpl.h - 1);
}

// ---- Pixeles nuevos (sin confirmar) ----
// Todo lo que se pinta (clic, trazo, bote, automatico, deshacer) queda como "nuevo"
// en el navegador y solo se guarda en el servidor al pulsar Confirmar.
const pending = new Map();   // "x,y" -> color (null = borrar)
let confirming = false;
let highlightNew = false;    // "Resaltar": atenua lo demas para ver solo lo nuevo

// Color que se ve en un pixel: el nuevo si hay, si no el guardado
function effective(k) { return pending.has(k) ? pending.get(k) : (pixels.get(k) || null); }

// Cambia el color de un pixel; queda como nuevo solo si difiere de lo guardado
function setPending(x, y, c) {
  const k = x + ',' + y;
  if ((pixels.get(k) || null) === c) pending.delete(k); else pending.set(k, c);
}

function changed() { pxVer++; updatePendingUI(); draw(); }

function updatePendingUI() {
  const box = document.getElementById('pend');
  if (!box) return;
  const n = pending.size;
  box.hidden = n === 0 && !confirming;
  if (!confirming) {
    document.getElementById('pendTxt').textContent =
      `${n} pixel${n === 1 ? '' : 'es'} nuevo${n === 1 ? '' : 's'} sin confirmar`;
  }
}

async function confirmPending() {
  if (confirming || !pending.size) return;
  confirming = true;
  const list = [...pending].map(([k, c]) => { const i = k.indexOf(','); return [+k.slice(0, i), +k.slice(i + 1), c]; });
  const txt = document.getElementById('pendTxt');
  document.getElementById('pendOk').disabled = document.getElementById('pendNo').disabled = true;
  let done = 0, ok = true;
  try {
    for (let k = 0; k < list.length; k += 500) {
      const chunk = list.slice(k, k + 500);
      if (!(await postBatch(chunk))) { ok = false; break; }
      for (const [x, y, c] of chunk) {
        const key = x + ',' + y;
        if (pending.get(key) === c) pending.delete(key);   // si se volvio a pintar mientras tanto, se queda nuevo
        if (c) pixels.set(key, c); else pixels.delete(key);
      }
      done += chunk.length;
      txt.textContent = `Guardando... ${Math.floor(done * 100 / list.length)}%`;
      pxVer++; draw();
    }
  } catch (e) { ok = false; }
  confirming = false;
  document.getElementById('pendOk').disabled = document.getElementById('pendNo').disabled = false;
  changed();
  setInfo(ok ? `Confirmados ${done} pixeles` : `Error al guardar (${done} de ${list.length} guardados)`);
}

function discardPending() {
  if (confirming || !pending.size) return;
  if (pending.size > 20 && !confirm(`¿Descartar ${pending.size} pixeles nuevos?`)) return;
  const n = pending.size;
  pending.clear();
  changed();
  setInfo(`Descartados ${n} pixeles nuevos`);
}

// Avisa si se intenta cerrar la pagina con pixeles sin confirmar
window.addEventListener('beforeunload', e => {
  if (pending.size) { e.preventDefault(); e.returnValue = ''; }
});

async function postBatch(chunk) {
  for (;;) {
    const headers = { 'Content-Type': 'application/json' };
    let pass = '';
    try { pass = localStorage.getItem('pixelmap-key') || ''; } catch (e) {}
    if (pass) headers['X-Key'] = pass;
    const r = await fetch(API, { method: 'POST', headers, body: JSON.stringify({ pixels: chunk }) });
    if (r.status !== 401) return r.ok;
    const p = prompt('Contrasena para pintar:');
    if (!p) return false;
    try { localStorage.setItem('pixelmap-key', p); } catch (e) {}
  }
}

// ---- Pintado automatico: agrega todos los faltantes como nuevos ----
async function autoPaint() {
  if (!tpl.data) return;
  await loadTplArea();                               // asegura datos frescos
  computeProgress();
  const op = [];
  for (let j = 0; j < tpl.missMask.length; j++) {
    if (!tpl.missMask[j]) continue;
    const x = tpl.x + (j % tpl.w), y = tpl.y + Math.floor(j / tpl.w);
    op.push([x, y, effective(x + ',' + y)]);
    setPending(x, y, tpl.hex[j]);
  }
  if (!op.length) { setInfo('¡No falta ningun pixel!'); return; }
  pushUndo(op);
  changed();
  setInfo(`${op.length} pixeles agregados como nuevos · revisa y pulsa Confirmar`);
}

// ---- Bote de pintura ----
// Modo "clasico": rellena el area cerrada segun lo pintado (mismo color o vacio), como en Paint.
// Modo "plantilla": rellena el bloque continuo del mismo color de la imagen.
// En ambos casos solo dentro de la plantilla.
let filling = false, fillBusy = false;
let fillMode = 'clasico';
try { fillMode = localStorage.getItem('pixelmap-fillmode') || 'clasico'; } catch (e) {}
let fillCache = null;   // ultima region calculada (para la vista previa)

// Indice del pixel dentro de la plantilla (-1 = fuera o transparente)
function tplIndex(cell) {
  if (!tpl.data) return -1;
  const ix = cell.x - tpl.x, iy = cell.y - tpl.y;
  if (ix < 0 || iy < 0 || ix >= tpl.w || iy >= tpl.h) return -1;
  const j = iy * tpl.w + ix;
  return tpl.hex[j] ? j : -1;
}

function hexToRgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }

// Calcula la region que rellenaria un clic en 'cell'. Usa cache mientras nada cambie.
function computeRegion(cell) {
  const j0 = tplIndex(cell);
  if (j0 < 0) return null;
  const sig = `${fillMode}|${pxVer}|${tplVer}|${tpl.x}|${tpl.y}|${tpl.use}|${color}`;
  if (fillCache && fillCache.sig === sig && fillCache.mask[j0]) return fillCache;

  const w = tpl.w, h = tpl.h, hex = tpl.hex, ox = tpl.x, oy = tpl.y;
  const painted = k => effective((ox + k % w) + ',' + (oy + ((k / w) | 0)));
  let same;
  if (fillMode === 'plantilla') { const t = hex[j0]; same = k => hex[k] === t; }
  else { const t = painted(j0); same = k => hex[k] !== null && painted(k) === t; }

  const mask = new Uint8Array(w * h), stack = [j0], region = [];
  mask[j0] = 1;
  while (stack.length) {
    const j = stack.pop(), x = j % w, y = (j - x) / w;
    region.push(j);
    if (x > 0 && !mask[j - 1] && same(j - 1)) { mask[j - 1] = 1; stack.push(j - 1); }
    if (x < w - 1 && !mask[j + 1] && same(j + 1)) { mask[j + 1] = 1; stack.push(j + 1); }
    if (y > 0 && !mask[j - w] && same(j - w)) { mask[j - w] = 1; stack.push(j - w); }
    if (y < h - 1 && !mask[j + w] && same(j + w)) { mask[j + w] = 1; stack.push(j + w); }
  }

  // Lista de cambios y lienzo de vista previa (con el color que quedara)
  const list = [];
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const cx = c.getContext('2d'), img = cx.createImageData(w, h), od = img.data, d = tpl.data;
  const fixed = tpl.use ? null : (color ? hexToRgb(color) : [255, 0, 255]);   // magenta = borrar
  for (const j of region) {
    const fc = tpl.use ? hex[j] : color;
    const prev = painted(j);
    if (prev !== fc) list.push([ox + j % w, oy + ((j / w) | 0), fc, prev]);
    const i = j * 4;
    if (fixed) { od[i] = fixed[0]; od[i + 1] = fixed[1]; od[i + 2] = fixed[2]; }
    else { od[i] = d[i]; od[i + 1] = d[i + 1]; od[i + 2] = d[i + 2]; }
    od[i + 3] = 255;
  }
  cx.putImageData(img, 0, 0);
  fillCache = { sig, mask, list, size: region.length, canvas: c };
  return fillCache;
}

function bucketFill(cell) {
  const reg = computeRegion(cell);
  if (!reg) { setInfo('El bote solo funciona dentro de la plantilla'); return; }
  const list = reg.list;
  if (!list.length) { setInfo('Esa area ya tiene ese color'); return; }
  const op = [];
  for (const [x, y, c, prev] of list) { op.push([x, y, prev]); setPending(x, y, c); }
  pushUndo(op);
  changed();
  setInfo(`Bote: ${list.length} pixeles nuevos · Enter para confirmar, Ctrl+Z para deshacer`);
}

// ---- Deshacer (Ctrl+Z) ----
// Cada operacion guarda [x, y, colorAnterior]. Deshacer tambien queda como "nuevo"
// (si ya se habia confirmado, hay que confirmar el deshacer para guardarlo).
const undoStack = [];
let curOp = null;        // operacion en curso (trazo con Espacio)

function pushUndo(op) {
  if (!op || !op.length) return;
  undoStack.push(op);
  if (undoStack.length > 50) undoStack.shift();
  updateUndoBtn();
}

function updateUndoBtn() {
  const b = document.getElementById('undoBtn');
  if (b) b.style.opacity = undoStack.length ? 1 : .4;
}

function undo() {
  if (confirming) return;
  const op = undoStack.pop();
  updateUndoBtn();
  if (!op) { setInfo('Nada que deshacer'); return; }
  // recorrer al reves: el valor mas antiguo de cada pixel es el que queda
  for (let i = op.length - 1; i >= 0; i--) setPending(op[i][0], op[i][1], op[i][2]);
  changed();
  setInfo(`Deshecho: ${op.length} pixeles (quedan ${undoStack.length} pasos)` +
          (pending.size ? ` · ${pending.size} nuevos sin confirmar` : ''));
}

// ---- Progreso: que pixeles de la plantilla faltan (contando los nuevos) ----
let pxVer = 0, tplVer = 0, progSig = '';
function computeProgress() {
  const sig = tpl.data ? `${pxVer}|${tplVer}|${tpl.x}|${tpl.y}` : '';
  if (sig === progSig) return;
  progSig = sig;
  const el = document.getElementById('tplProg');
  if (!tpl.data) { tpl.missCanvas = null; tpl.missMask = null; if (el) el.textContent = ''; return; }
  const w = tpl.w, h = tpl.h, d = tpl.data;
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const cx = c.getContext('2d');
  const out = cx.createImageData(w, h), od = out.data;
  const mask = new Uint8Array(w * h), lum = new Uint8Array(w * h);
  let total = 0, done = 0, saved = 0;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const j = y * w + x, i = j * 4;
    if (d[i + 3] < 128) continue;
    total++;
    const k = (tpl.x + x) + ',' + (tpl.y + y);
    if (pixels.get(k) === tpl.hex[j]) saved++;
    if (effective(k) === tpl.hex[j]) { done++; continue; }
    mask[j] = 1;
    lum[j] = (d[i] * 299 + d[i + 1] * 587 + d[i + 2] * 114) / 1000;
    od[i] = d[i]; od[i + 1] = d[i + 1]; od[i + 2] = d[i + 2]; od[i + 3] = 255;
  }
  cx.putImageData(out, 0, 0);
  tpl.missCanvas = c; tpl.missMask = mask; tpl.lum = lum;
  tpl.total = total; tpl.done = done;
  const pct = total ? Math.floor(done * 100 / total) : 0;
  if (el) el.textContent = `Pintados ${done} / ${total} (${pct}%) · faltan ${total - done}` +
                           (done !== saved ? ` · guardados ${saved}` : '');
}

// Centra el mapa en el siguiente pixel faltante
function goToMissing() {
  computeProgress();
  if (!tpl.missMask) return;
  const m = tpl.missMask, w = tpl.w;
  const start = tpl.lastGo == null ? 0 : tpl.lastGo + 1;
  for (let k = 0; k < m.length; k++) {
    const j = (start + k) % m.length;
    if (!m[j]) continue;
    tpl.lastGo = j;
    const cell = { x: tpl.x + (j % w), y: tpl.y + Math.floor(j / w) };
    const ll = map.unproject([cell.x + 0.5, cell.y + 0.5], Z);
    map.setView(ll, Math.max(map.getZoom(), MIN_PAINT + 2));
    return;
  }
  setInfo('¡No falta ningun pixel!');
}

// Color de la plantilla en un pixel del mapa (undefined = fuera o transparente)
function tplColor(cell) {
  if (!tpl.data) return undefined;
  const ix = cell.x - tpl.x, iy = cell.y - tpl.y;
  if (ix < 0 || iy < 0 || ix >= tpl.w || iy >= tpl.h) return undefined;
  return tpl.hex[iy * tpl.w + ix] || undefined;
}

function brushColor(cell) {
  return tpl.use && tpl.data ? tplColor(cell) : color;
}

function paint(cell) {
  const c = brushColor(cell);
  if (c === undefined) return;            // fuera de la plantilla
  const prev = effective(cell.x + ',' + cell.y);
  if (prev === c) return;                 // ya tiene ese color
  // guarda para deshacer: dentro del trazo actual, o como paso propio si es un clic
  if (curOp) curOp.push([cell.x, cell.y, prev]);
  else pushUndo([[cell.x, cell.y, prev]]);
  setPending(cell.x, cell.y, c);
  changed();
}

function setInfo(t) { document.getElementById('info').textContent = t; }
function updateInfo() {
  const z = map.getZoom();
  if (picking) {
    const c = hover ? pickColorAt(hover) : null;
    setInfo('Cuentagotas: ' + (c || '—') + ' · clic para tomar el color (Esc cancela)');
  }
  else if (filling) {
    const reg = hover && !fillBusy ? computeRegion(hover) : null;
    const modo = fillMode === 'plantilla' ? 'color de la plantilla' : 'area cerrada';
    if (!reg) setInfo(`Bote (${modo}): solo funciona dentro de la plantilla · Esc cancela`);
    else if (!reg.list.length) setInfo(`Bote (${modo}): esa area (${reg.size} px) ya tiene ese color`);
    else setInfo(`Bote (${modo}): clic para rellenar ${reg.list.length} pixeles · Esc cancela`);
  }
  else if (tpl.placing) setInfo('Clic en el mapa para colocar la plantilla (Esc para cancelar)');
  else if (z < MIN_PAINT) setInfo('Acercate para pintar (zoom ' + z + ' / ' + MIN_PAINT + ')');
  else if (spaceDown) setInfo('Pintando... (suelta Espacio para parar)');
  else setInfo((hover ? `Pixel ${hover.x}, ${hover.y} · ` : '') + 'Clic para pintar · mantén Espacio y mueve el mouse');
}

// ---- Paleta ----
const pal = document.getElementById('palette');

function selectColor(c) {
  color = c;
  pal.querySelectorAll('.sw').forEach(e => e.classList.toggle('sel', !e.classList.contains('tool') && e.dataset.c === String(c)));
  // elegir un color de la paleta desactiva "pintar con la plantilla"
  if (tpl.use) { tpl.use = false; $('tplUse').checked = false; saveTpl(); }
}

function makeSwatch(c, custom) {
  const b = document.createElement('button');
  b.className = 'sw' + (c ? '' : ' erase') + (custom ? ' custom' : '');
  b.dataset.c = String(c);
  if (c) b.style.background = c;
  b.title = c ? c + (custom ? ' (cuentagotas · clic derecho para quitar)' : '') : 'Borrar';
  b.onclick = () => selectColor(c);
  if (custom) b.oncontextmenu = e => {
    e.preventDefault();
    customColors = customColors.filter(x => x !== c);
    saveCustom(); renderPalette();
    if (color === c) selectColor(COLORS[0]);
  };
  return b;
}

function saveCustom() {
  try { localStorage.setItem(CUSTOM_KEY, JSON.stringify(customColors)); } catch (e) {}
}

const dropper = document.createElement('button');
dropper.className = 'sw tool';
dropper.title = 'Cuentagotas (tecla I): toma un color de la plantilla';
dropper.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m2 22 1-1h3l9-9"/><path d="M3 21v-3l9-9"/><path d="m15 6 3.4-3.4a2.1 2.1 0 1 1 3 3L18 9l.4.4a2.1 2.1 0 1 1-3 3l-3.8-3.8a2.1 2.1 0 1 1 3-3l.4.4Z"/></svg>';
dropper.onclick = () => setPicking(!picking);

const bucket = document.createElement('button');
bucket.className = 'sw tool';
bucket.title = 'Bote de pintura (tecla B): rellena un area dentro de la plantilla. El modo se elige en el panel Plantilla';
bucket.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m19 11-8-8-8.6 8.6a2 2 0 0 0 0 2.8l5.2 5.2c.8.8 2 .8 2.8 0L19 11Z"/><path d="m5 2 5 5"/><path d="M2 13h15"/><path d="M22 20a2 2 0 1 1-4 0c0-1.6 1.7-2.4 2-4 .3 1.6 2 2.4 2 4Z"/></svg>';
bucket.onclick = () => setFilling(!filling);

function setFilling(on) {
  filling = on;
  if (on) { if (picking) setPicking(false); tpl.placing = false; }
  bucket.classList.toggle('on', on);
  document.getElementById('map').classList.toggle('filling', on);
  if (typeof syncUI === 'function') syncUI();
  updateInfo(); draw();
}

const undoBtn = document.createElement('button');
undoBtn.className = 'sw tool';
undoBtn.id = 'undoBtn';
undoBtn.title = 'Deshacer (Ctrl+Z)';
undoBtn.style.opacity = .4;
undoBtn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>';
undoBtn.onclick = () => undo();

function renderPalette() {
  pal.innerHTML = '';
  pal.appendChild(undoBtn);
  pal.appendChild(dropper);
  pal.appendChild(bucket);
  COLORS.forEach(c => pal.appendChild(makeSwatch(c, false)));
  if (customColors.length) {
    const s = document.createElement('div'); s.className = 'sep'; pal.appendChild(s);
    customColors.forEach(c => pal.appendChild(makeSwatch(c, true)));
  }
  pal.querySelectorAll('.sw').forEach(e => e.classList.toggle('sel', !e.classList.contains('tool') && e.dataset.c === String(color)));
}

function setPicking(on) {
  picking = on;
  if (on) { tpl.placing = false; if (filling) setFilling(false); }
  dropper.classList.toggle('on', on);
  document.getElementById('map').classList.toggle('picking', on);
  if (typeof syncUI === 'function') syncUI();
  updateInfo(); draw();
}

// Color bajo el cursor: primero la plantilla, si no, el pixel ya pintado
function pickColorAt(cell) {
  return tplColor(cell) || effective(cell.x + ',' + cell.y);
}

function pickAt(cell) {
  const c = pickColorAt(cell);
  setPicking(false);
  if (!c) { setInfo('No hay color en ese pixel'); return; }
  if (!COLORS.includes(c)) {
    customColors = [c, ...customColors.filter(x => x !== c)].slice(0, 16);
    saveCustom(); renderPalette();
  }
  selectColor(c);
  setInfo('Color tomado: ' + c);
}

renderPalette();

// ---- Plantilla ----
const $ = id => document.getElementById(id);
const panel = $('tpl');

function saveTpl() {
  try {
    if (!tpl.src) { localStorage.removeItem(TPL_KEY); return; }
    localStorage.setItem(TPL_KEY, JSON.stringify({
      src: tpl.src, x: tpl.x, y: tpl.y, w: tpl.w,
      opacity: tpl.opacity, visible: tpl.visible, use: tpl.use, showMissing: tpl.showMissing
    }));
  } catch (e) { /* imagen muy grande para localStorage: solo dura esta sesion */ }
}

// Reescala la imagen original al ancho pedido (1 px = 1 pixel del mapa)
function buildTpl(width) {
  const img = tpl.img;
  tpl.w = Math.max(1, Math.min(2000, Math.round(width)));
  tpl.h = Math.max(1, Math.round(img.naturalHeight * tpl.w / img.naturalWidth));
  const c = document.createElement('canvas');
  c.width = tpl.w; c.height = tpl.h;
  const cx = c.getContext('2d', { willReadFrequently: true });
  cx.imageSmoothingEnabled = tpl.w < img.naturalWidth;   // suaviza solo al reducir
  cx.imageSmoothingQuality = 'high';
  cx.drawImage(img, 0, 0, tpl.w, tpl.h);
  tpl.canvas = c;
  tpl.data = cx.getImageData(0, 0, tpl.w, tpl.h).data;
  // color hex de cada pixel (null = transparente)
  const d = tpl.data;
  tpl.hex = new Array(tpl.w * tpl.h);
  for (let j = 0; j < tpl.hex.length; j++) {
    const i = j * 4;
    tpl.hex[j] = d[i + 3] < 128 ? null
      : '#' + ((1 << 24) | (d[i] << 16) | (d[i + 1] << 8) | d[i + 2]).toString(16).slice(1);
  }
  tpl.lastGo = null;
  tplVer++;
  $('tplW').value = tpl.w;
  $('tplH').textContent = '× ' + tpl.h;
}

function syncUI() {
  panel.classList.toggle('has', !!tpl.canvas);
  $('tplOp').value = tpl.opacity;
  $('tplShow').textContent = tpl.visible ? 'Ocultar' : 'Mostrar';
  $('tplMove').classList.toggle('on', tpl.placing);
  $('tplUse').checked = tpl.use;
  $('tplMiss').checked = tpl.showMissing;
}

function loadImage(src, cb) {
  const img = new Image();
  img.onload = () => cb(img);
  img.onerror = () => setInfo('No se pudo leer la imagen');
  img.src = src;
}

$('tplFile').onchange = e => {
  const f = e.target.files[0];
  if (!f) return;
  const reader = new FileReader();
  reader.onload = () => loadImage(reader.result, img => {
    tpl.img = img;
    buildTpl(Math.min(img.naturalWidth, 200));
    // guarda la version reescalada (mas ligera) y la centra en la vista
    tpl.src = tpl.canvas.toDataURL('image/png');
    const c = toCell(map.getCenter());
    tpl.x = c.x - Math.floor(tpl.w / 2); tpl.y = c.y - Math.floor(tpl.h / 2);
    tpl.visible = true;
    if (map.getZoom() < MIN_PAINT - 1) map.setZoom(MIN_PAINT - 1);
    saveTpl(); syncUI(); draw(); loadTplArea();
  });
  reader.readAsDataURL(f);
  e.target.value = '';
};

$('tplW').onchange = e => {
  if (!tpl.img) return;
  buildTpl(+e.target.value || tpl.w);
  tpl.src = tpl.canvas.toDataURL('image/png');
  saveTpl(); draw(); loadTplArea();
};
$('tplMiss').onchange = e => {
  tpl.showMissing = e.target.checked; tpl.visible = true;
  saveTpl(); syncUI(); draw();
  e.target.blur();                 // devuelve el foco al mapa para que Alt / Espacio respondan
  if (tpl.showMissing && tpl.total) {
    const faltan = tpl.total - tpl.done;
    setInfo(faltan ? `Faltan ${faltan} pixeles (marcados con un punto)`
                   : 'Plantilla completa: no falta ningun pixel');
  }
};
$('tplNext').onclick = goToMissing;
$('tplAuto').onclick = autoPaint;
$('pendOk').onclick = e => { e.target.blur(); confirmPending(); };
$('pendNo').onclick = e => { e.target.blur(); discardPending(); };
$('pendHi').onchange = e => { highlightNew = e.target.checked; e.target.blur(); draw(); };
$('fillMode').value = fillMode;
$('fillMode').onchange = e => {
  fillMode = e.target.value;
  try { localStorage.setItem('pixelmap-fillmode', fillMode); } catch (err) {}
  e.target.blur();
  updateInfo(); draw();
};
$('tplOp').oninput = e => { tpl.opacity = +e.target.value; saveTpl(); draw(); };
$('tplShow').onclick = () => { tpl.visible = !tpl.visible; saveTpl(); syncUI(); draw(); };
$('tplMove').onclick = () => { if (picking) setPicking(false); if (filling) setFilling(false); tpl.placing = !tpl.placing; syncUI(); updateInfo(); draw(); };
$('tplUse').onchange = e => { tpl.use = e.target.checked; saveTpl(); };
$('tplDel').onclick = () => {
  if (!confirm('¿Quitar la plantilla? (los pixeles pintados se quedan)')) return;
  Object.assign(tpl, { src: null, img: null, canvas: null, data: null, hex: null, placing: false, use: false });
  saveTpl(); syncUI(); updateInfo(); draw();
};

// Restaurar plantilla guardada
try {
  const saved = JSON.parse(localStorage.getItem(TPL_KEY) || 'null');
  if (saved && saved.src) {
    loadImage(saved.src, img => {
      tpl.img = img; tpl.src = saved.src;
      Object.assign(tpl, { x: saved.x, y: saved.y, opacity: saved.opacity ?? 0.5,
                           visible: saved.visible !== false, use: !!saved.use,
                           showMissing: !!saved.showMissing });
      buildTpl(saved.w || img.naturalWidth);
      syncUI(); draw(); loadTplArea();
    });
  }
} catch (e) {}
syncUI();

// ---- Eventos ----
map.on('click', e => {
  if (picking) { pickAt(toCell(e.latlng)); return; }
  if (filling) {
    if (map.getZoom() < MIN_PAINT) { map.setView(e.latlng, MIN_PAINT + 1); return; }
    bucketFill(toCell(e.latlng)); return;
  }
  if (tpl.placing) {
    const c = toCell(e.latlng);
    tpl.x = c.x; tpl.y = c.y; tpl.placing = false; tpl.visible = true; tpl.lastGo = null;
    saveTpl(); syncUI(); updateInfo(); draw(); loadTplArea();
    return;
  }
  if (map.getZoom() < MIN_PAINT) { map.setView(e.latlng, MIN_PAINT + 1); return; }
  paint(toCell(e.latlng));
});
// Pinta todos los pixeles entre el ultimo y el actual (para que no queden huecos)
function strokeTo(cell) {
  if (map.getZoom() < MIN_PAINT || tpl.placing) return;
  if (!lastCell) { paint(cell); lastCell = cell; return; }
  let x0 = lastCell.x, y0 = lastCell.y;
  const x1 = cell.x, y1 = cell.y;
  const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0);
  const sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  let err = dx + dy;
  while (x0 !== x1 || y0 !== y1) {
    const e2 = 2 * err;
    if (e2 >= dy) { err += dy; x0 += sx; }
    if (e2 <= dx) { err += dx; y0 += sy; }
    paint({ x: x0, y: y0 });
  }
  lastCell = cell;
}

function stopStroke() {
  spaceDown = false;
  lastCell = null;
  if (curOp) { pushUndo(curOp); curOp = null; }   // todo el trazo = un solo paso de deshacer
  updateInfo();
}

map.on('mousemove', e => {
  hover = toCell(e.latlng);
  if (spaceDown) strokeTo(hover);
  draw(); updateInfo();
});

document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !(e.target.matches && e.target.matches('input, select, textarea'))) {
    if (pending.size) { e.preventDefault(); confirmPending(); }
    return;
  }
  if ((e.ctrlKey || e.metaKey) && !e.shiftKey && (e.key === 'z' || e.key === 'Z')) {
    if (e.target.matches && e.target.matches('input[type=number]')) return;
    e.preventDefault(); undo(); return;
  }
  if (e.key === 'Escape' && picking) { setPicking(false); return; }
  if (e.key === 'Escape' && filling) { setFilling(false); return; }
  if (e.key === 'Escape' && tpl.placing) { tpl.placing = false; syncUI(); updateInfo(); draw(); return; }
  if (e.target.matches && e.target.matches('input[type=number]')) return;
  if ((e.key === 'i' || e.key === 'I') && !e.ctrlKey && !e.metaKey) { setPicking(!picking); return; }
  if ((e.key === 'b' || e.key === 'B') && !e.ctrlKey && !e.metaKey) { setFilling(!filling); return; }
  if (e.code !== 'Space') return;
  if (picking || filling) { e.preventDefault(); return; }
  e.preventDefault();               // evita que Espacio active un boton
  if (e.repeat || spaceDown) return;
  spaceDown = true;
  lastCell = null;
  curOp = [];
  if (hover) strokeTo(hover);
  updateInfo();
});
document.addEventListener('keyup', e => {
  if (e.code !== 'Space') return;
  // evita que Espacio "haga clic" en el boton o casilla que tenga el foco
  if (!(e.target.matches && e.target.matches('input[type=number]'))) e.preventDefault();
  stopStroke();
});
window.addEventListener('blur', stopStroke);

// Alt (sola) = mostrar/ocultar la plantilla. Si se usa en combinacion (Alt+Tab, etc.) no hace nada.
let altAlone = false;
document.addEventListener('keydown', e => { altAlone = e.key === 'Alt' && !e.repeat ? true : (e.key === 'Alt' ? altAlone : false); });
document.addEventListener('keyup', e => {
  if (e.key !== 'Alt') return;
  e.preventDefault();               // evita que Windows active el menu del navegador
  if (!altAlone) return;
  altAlone = false;
  if (!tpl.canvas) return;
  tpl.visible = !tpl.visible;
  saveTpl(); syncUI(); draw();
  setInfo(tpl.visible ? 'Plantilla visible (Alt para ocultar)' : 'Plantilla oculta (Alt para mostrar)');
});
window.addEventListener('blur', () => { altAlone = false; });
map.on('mouseout', () => { hover = null; draw(); });
map.on('move', draw);
map.on('zoomstart', () => { canvas.style.visibility = 'hidden'; });
map.on('zoomend', () => { canvas.style.visibility = ''; draw(); updateInfo(); });
map.on('moveend', load);
map.on('resize', resize);

// Evita que los clics en el panel lleguen al mapa
L.DomEvent.disableClickPropagation(panel);
L.DomEvent.disableScrollPropagation(panel);

resize();
load();
updateInfo();
</script>
</body>
</html>
