<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PixelMap</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
  #map { position: absolute; inset: 0; cursor: crosshair; }
  #pixels { position: absolute; inset: 0; pointer-events: none; z-index: 450; }
  .panel {
    position: absolute; z-index: 1000; background: #fff; border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,.25); padding: 10px;
  }
  #bar {
    left: 50%; bottom: 16px; transform: translateX(-50%);
    display: flex; flex-direction: column; gap: 8px; max-width: calc(100vw - 32px);
  }
  #palette { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; }
  .sw { width: 26px; height: 26px; border-radius: 6px; border: 2px solid #ddd; cursor: pointer; padding: 0; }
  .sw.sel { border-color: #111; transform: scale(1.12); }
  .sw.erase { background: repeating-conic-gradient(#ccc 0 25%, #fff 0 50%) 0 0/10px 10px; }
  .sw.tool { background: #f6f6f6; display: grid; place-items: center; }
  .sw.tool.on { background: #111; color: #fff; border-color: #111; }
  .sw.custom { border-style: dashed; border-color: #999; }
  .sw.custom.sel { border-style: solid; border-color: #111; }
  .sep { width: 1px; background: #ddd; margin: 0 2px; }
  #map.picking { cursor: copy; }
  #info { font-size: 12px; color: #555; text-align: center; }

  #tpl { top: 12px; right: 12px; width: 230px; font-size: 13px; max-width: calc(100vw - 80px); }
  #tpl summary { font-weight: 600; cursor: pointer; }
  #tpl .row { display: flex; align-items: center; gap: 6px; margin-top: 8px; }
  #tpl .row label { flex: 0 0 64px; color: #555; }
  #tpl input[type=number] { width: 70px; }
  #tpl input[type=range] { flex: 1; }
  #tpl button { flex: 1; padding: 5px; border: 1px solid #ccc; border-radius: 6px; background: #f6f6f6; cursor: pointer; }
  #tpl button.on { background: #111; color: #fff; border-color: #111; }
  #tpl .hint { font-size: 11px; color: #777; margin-top: 6px; }
  #tpl .needs { display: none; }
  #tpl.has .needs { display: block; }
  #tpl.has .row.needs { display: flex; }
</style>
</head>
<body>
<div id="map"></div>
<canvas id="pixels"></canvas>

<details id="tpl" class="panel" open>
  <summary>Plantilla</summary>
  <div class="row"><input type="file" id="tplFile" accept="image/*"></div>
  <div class="row needs"><label>Ancho</label><input type="number" id="tplW" min="1" max="2000"> <span id="tplH" style="color:#777"></span></div>
  <div class="row needs"><label>Opacidad</label><input type="range" id="tplOp" min="0" max="1" step="0.05"></div>
  <div class="row needs">
    <button id="tplMove" title="Clic en el mapa para colocar la esquina superior izquierda">Mover</button>
    <button id="tplShow">Ocultar</button>
    <button id="tplDel">Quitar</button>
  </div>
  <div class="row needs"><label style="flex:1"><input type="checkbox" id="tplUse"> Pintar con los colores de la plantilla</label></div>
  <div class="row needs">
    <label style="flex:1"><input type="checkbox" id="tplMiss"> Ver faltantes</label>
    <button id="tplNext" style="flex:0 0 auto" title="Centrar el mapa en el siguiente pixel que falta">Ir a faltante</button>
  </div>
  <div class="row needs">
    <button id="tplAuto" title="Pinta todos los pixeles que faltan con los colores de la plantilla">Pintar todo automático</button>
  </div>
  <div class="hint needs" id="tplProg"></div>
  <div class="hint needs">Cada pixel de la imagen = 1 pixel del mapa.</div>
</details>

<div id="bar" class="panel">
  <div id="palette"></div>
  <div id="info">Acercate para pintar</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
// ---- Configuracion ----
const Z = 13;            // zoom de la cuadricula (13 = ~19 m por pixel en el ecuador)
const MIN_VIEW = 9;      // zoom minimo para mostrar pixeles
const MIN_PAINT = 15;    // zoom minimo para pintar (cada pixel = 4 px en pantalla)
const API = 'api.php';
const TPL_KEY = 'pixelmap-template';
const COLORS = ['#000000','#3c3c3c','#787878','#d2d2d2','#ffffff','#600018','#ed1c24','#ff7f27',
  '#f6aa09','#f9dd3b','#fffabc','#0eb968','#13e67b','#87ff5e','#0c816e','#10aea6','#13e1be',
  '#28509e','#4093e4','#60f7f2','#6b50f6','#99b1fb','#780c99','#aa38b9','#e09ff9','#cb007a',
  '#ec1f80','#f38da9','#684634','#95682a','#f8b277', null];

// ---- Estado ----
const pixels = new Map();          // "x,y" -> color
let color = COLORS[6];
let hover = null;
let spaceDown = false;   // Espacio presionado = modo pintar al mover
let lastCell = null;     // ultimo pixel del trazo
let asking = false;      // evita pedir la contrasena varias veces
let picking = false;     // cuentagotas activo
const CUSTOM_KEY = 'pixelmap-custom';
let customColors = [];   // colores tomados con el cuentagotas
try { customColors = JSON.parse(localStorage.getItem(CUSTOM_KEY) || '[]'); } catch (e) {}

// Plantilla: imagen original + version reescalada (1 px = 1 pixel del mapa)
const tpl = { src: null, img: null, canvas: null, data: null, x: 0, y: 0, w: 0, h: 0,
              opacity: 0.5, visible: true, placing: false, use: false,
              hex: null, showMissing: false, missCanvas: null, missMask: null, lum: null, lastGo: null };

// ---- Mapa ----
const map = L.map('map', { worldCopyJump: true }).setView([19.4326, -99.1332], 16);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19, attribution: '&copy; OpenStreetMap'
}).addTo(map);

const canvas = document.getElementById('pixels');
const ctx = canvas.getContext('2d');

function resize() {
  const s = map.getSize(), dpr = devicePixelRatio || 1;
  canvas.width = s.x * dpr; canvas.height = s.y * dpr;
  canvas.style.width = s.x + 'px'; canvas.style.height = s.y + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  draw();
}

function tplPos() {
  // mientras se mueve, la plantilla sigue al cursor
  return tpl.placing && hover ? hover : { x: tpl.x, y: tpl.y };
}

function draw() {
  computeProgress();
  const s = map.getSize();
  ctx.clearRect(0, 0, s.x, s.y);
  if (map.getZoom() < MIN_VIEW) return;
  const scale = Math.pow(2, map.getZoom() - Z);
  const o = map.getPixelBounds().min;
  const size = Math.max(scale, 1);

  // Plantilla (debajo de los pixeles pintados)
  if (tpl.canvas && (tpl.visible || tpl.placing) && (!tpl.showMissing || tpl.placing)) {
    const p = tplPos();
    ctx.save();
    ctx.globalAlpha = tpl.placing ? Math.max(tpl.opacity, 0.6) : tpl.opacity;
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(tpl.canvas, p.x * scale - o.x, p.y * scale - o.y, tpl.w * scale, tpl.h * scale);
    ctx.restore();
    if (tpl.placing) {
      ctx.strokeStyle = '#1a73e8'; ctx.lineWidth = 2; ctx.setLineDash([6, 4]);
      ctx.strokeRect(p.x * scale - o.x, p.y * scale - o.y, tpl.w * scale, tpl.h * scale);
      ctx.setLineDash([]);
    }
  }

  for (const [k, c] of pixels) {
    const i = k.indexOf(',');
    const sx = k.slice(0, i) * scale - o.x, sy = k.slice(i + 1) * scale - o.y;
    if (sx < -size || sy < -size || sx > s.x || sy > s.y) continue;
    ctx.fillStyle = c;
    ctx.fillRect(sx, sy, size, size);
  }

  // Modo "ver faltantes": encima de todo, solo los pixeles que faltan o estan mal
  if (tpl.showMissing && tpl.missCanvas && tpl.visible && !tpl.placing) {
    const ox = tpl.x * scale - o.x, oy = tpl.y * scale - o.y;
    ctx.save();
    ctx.imageSmoothingEnabled = false;
    ctx.globalAlpha = Math.max(tpl.opacity, 0.7);
    ctx.drawImage(tpl.missCanvas, ox, oy, tpl.w * scale, tpl.h * scale);
    ctx.restore();
    // marca cada faltante con un punto (solo si se ve lo bastante grande)
    if (scale >= 4) {
      const x0 = Math.max(0, Math.floor(-ox / scale)), x1 = Math.min(tpl.w, Math.ceil((s.x - ox) / scale));
      const y0 = Math.max(0, Math.floor(-oy / scale)), y1 = Math.min(tpl.h, Math.ceil((s.y - oy) / scale));
      const d = Math.max(2, Math.round(scale / 4)), off = (scale - d) / 2;
      for (let y = y0; y < y1; y++) for (let x = x0; x < x1; x++) {
        const j = y * tpl.w + x;
        if (!tpl.missMask[j]) continue;
        ctx.fillStyle = tpl.lum[j] > 140 ? 'rgba(0,0,0,.6)' : 'rgba(255,255,255,.8)';
        ctx.fillRect(ox + x * scale + off, oy + y * scale + off, d, d);
      }
    }
    ctx.strokeStyle = '#e8711a'; ctx.lineWidth = 1; ctx.setLineDash([4, 3]);
    ctx.strokeRect(ox - .5, oy - .5, tpl.w * scale + 1, tpl.h * scale + 1);
    ctx.setLineDash([]);
  }
  if (hover && map.getZoom() >= MIN_PAINT && !tpl.placing) {
    ctx.strokeStyle = '#000'; ctx.lineWidth = 1;
    ctx.strokeRect(hover.x * scale - o.x + .5, hover.y * scale - o.y + .5, size - 1, size - 1);
  }
}

function toCell(latlng) {
  const p = map.project(latlng, Z).floor();
  return { x: p.x, y: p.y };
}

async function fetchArea(x1, y1, x2, y2) {
  try {
    const r = await fetch(`${API}?x1=${x1}&y1=${y1}&x2=${x2}&y2=${y2}`);
    const data = await r.json();
    for (const [x, y, col] of data) pixels.set(x + ',' + y, col);
    pxVer++;
    draw();
  } catch (e) { setInfo('No se pudo cargar: ' + e.message); }
}

function load() {
  if (map.getZoom() < MIN_VIEW) { draw(); return; }
  const b = map.getBounds();
  const a = map.project(b.getNorthWest(), Z).floor();
  const c = map.project(b.getSouthEast(), Z).floor();
  fetchArea(a.x, a.y, c.x, c.y);
}

// Carga los pixeles de toda la plantilla (para contar el progreso aunque no este en pantalla)
function loadTplArea() {
  if (tpl.data) return fetchArea(tpl.x, tpl.y, tpl.x + tpl.w - 1, tpl.y + tpl.h - 1);
}

// ---- Pintado automatico: pinta todos los faltantes por lotes ----
let autoRunning = false, autoStop = false;
async function autoPaint() {
  if (autoRunning) { autoStop = true; return; }     // segundo clic = detener
  if (!tpl.data) return;
  await loadTplArea();                               // asegura datos frescos
  computeProgress();
  const list = [];
  for (let j = 0; j < tpl.missMask.length; j++) {
    if (tpl.missMask[j]) list.push([tpl.x + (j % tpl.w), tpl.y + Math.floor(j / tpl.w), tpl.hex[j]]);
  }
  if (!list.length) { setInfo('¡No falta ningun pixel!'); return; }
  if (!confirm(`¿Pintar automaticamente ${list.length} pixeles?`)) return;

  autoRunning = true; autoStop = false;
  const btn = $('tplAuto');
  btn.classList.add('on');
  const BATCH = 500;
  let done = 0;
  try {
    for (let k = 0; k < list.length && !autoStop; k += BATCH) {
      const chunk = list.slice(k, k + BATCH);
      let r;
      for (;;) {
        const headers = { 'Content-Type': 'application/json' };
        let pass = '';
        try { pass = localStorage.getItem('pixelmap-key') || ''; } catch (e) {}
        if (pass) headers['X-Key'] = pass;
        r = await fetch(API, { method: 'POST', headers, body: JSON.stringify({ pixels: chunk }) });
        if (r.status !== 401) break;
        const p = prompt('Contrasena para pintar:');
        if (!p) { autoStop = true; break; }
        try { localStorage.setItem('pixelmap-key', p); } catch (e) {}
      }
      if (autoStop) break;
      if (!r.ok) { setInfo('Error al guardar el lote'); break; }
      for (const [x, y, c] of chunk) pixels.set(x + ',' + y, c);
      pxVer++;
      done += chunk.length;
      btn.textContent = `Detener (${Math.floor(done * 100 / list.length)}%)`;
      draw();
      await new Promise(res => setTimeout(res, 30));   // deja respirar al navegador y al servidor
    }
  } catch (e) {
    setInfo('Error: ' + e.message);
  } finally {
    autoRunning = false;
    btn.classList.remove('on');
    btn.textContent = 'Pintar todo automático';
    setInfo(autoStop ? `Detenido: ${done} de ${list.length} pixeles pintados`
                     : `Listo: ${done} pixeles pintados`);
  }
}

// ---- Progreso: que pixeles de la plantilla faltan ----
let pxVer = 0, tplVer = 0, progSig = '';
function computeProgress() {
  const sig = tpl.data ? `${pxVer}|${tplVer}|${tpl.x}|${tpl.y}` : '';
  if (sig === progSig) return;
  progSig = sig;
  const el = document.getElementById('tplProg');
  if (!tpl.data) { tpl.missCanvas = null; tpl.missMask = null; if (el) el.textContent = ''; return; }
  const w = tpl.w, h = tpl.h, d = tpl.data;
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const cx = c.getContext('2d');
  const out = cx.createImageData(w, h), od = out.data;
  const mask = new Uint8Array(w * h), lum = new Uint8Array(w * h);
  let total = 0, done = 0;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const j = y * w + x, i = j * 4;
    if (d[i + 3] < 128) continue;
    total++;
    if (pixels.get((tpl.x + x) + ',' + (tpl.y + y)) === tpl.hex[j]) { done++; continue; }
    mask[j] = 1;
    lum[j] = (d[i] * 299 + d[i + 1] * 587 + d[i + 2] * 114) / 1000;
    od[i] = d[i]; od[i + 1] = d[i + 1]; od[i + 2] = d[i + 2]; od[i + 3] = 255;
  }
  cx.putImageData(out, 0, 0);
  tpl.missCanvas = c; tpl.missMask = mask; tpl.lum = lum;
  tpl.total = total; tpl.done = done;
  const pct = total ? Math.floor(done * 100 / total) : 0;
  if (el) el.textContent = `Pintados ${done} / ${total} (${pct}%) · faltan ${total - done}`;
}

// Centra el mapa en el siguiente pixel faltante
function goToMissing() {
  computeProgress();
  if (!tpl.missMask) return;
  const m = tpl.missMask, w = tpl.w;
  const start = tpl.lastGo == null ? 0 : tpl.lastGo + 1;
  for (let k = 0; k < m.length; k++) {
    const j = (start + k) % m.length;
    if (!m[j]) continue;
    tpl.lastGo = j;
    const cell = { x: tpl.x + (j % w), y: tpl.y + Math.floor(j / w) };
    const ll = map.unproject([cell.x + 0.5, cell.y + 0.5], Z);
    map.setView(ll, Math.max(map.getZoom(), MIN_PAINT + 2));
    return;
  }
  setInfo('¡No falta ningun pixel!');
}

// Color de la plantilla en un pixel del mapa (undefined = fuera o transparente)
function tplColor(cell) {
  if (!tpl.data) return undefined;
  const ix = cell.x - tpl.x, iy = cell.y - tpl.y;
  if (ix < 0 || iy < 0 || ix >= tpl.w || iy >= tpl.h) return undefined;
  return tpl.hex[iy * tpl.w + ix] || undefined;
}

function brushColor(cell) {
  return tpl.use && tpl.data ? tplColor(cell) : color;
}

async function paint(cell) {
  const c = brushColor(cell);
  if (c === undefined) return;            // fuera de la plantilla
  const key = cell.x + ',' + cell.y;
  const prev = pixels.get(key);
  if ((prev || null) === c) return;       // ya tiene ese color
  if (c) pixels.set(key, c); else pixels.delete(key);
  pxVer++;
  draw();
  const headers = { 'Content-Type': 'application/json' };
  let pass = '';
  try { pass = localStorage.getItem('pixelmap-key') || ''; } catch (e) {}
  if (pass) headers['X-Key'] = pass;
  const r = await fetch(API, { method: 'POST', headers, body: JSON.stringify({ x: cell.x, y: cell.y, color: c }) });
  if (!r.ok) {
    if (prev) pixels.set(key, prev); else pixels.delete(key);
    pxVer++;
    draw();
    if (r.status === 401) {
      if (asking) return;
      asking = true;
      const p = prompt('Contrasena para pintar:');
      asking = false;
      if (p) { try { localStorage.setItem('pixelmap-key', p); } catch (e) {} paint(cell); }
    } else setInfo('Error al guardar');
  }
}

function setInfo(t) { document.getElementById('info').textContent = t; }
function updateInfo() {
  const z = map.getZoom();
  if (picking) {
    const c = hover ? pickColorAt(hover) : null;
    setInfo('Cuentagotas: ' + (c || '—') + ' · clic para tomar el color (Esc cancela)');
  }
  else if (tpl.placing) setInfo('Clic en el mapa para colocar la plantilla (Esc para cancelar)');
  else if (z < MIN_PAINT) setInfo('Acercate para pintar (zoom ' + z + ' / ' + MIN_PAINT + ')');
  else if (spaceDown) setInfo('Pintando... (suelta Espacio para parar)');
  else setInfo((hover ? `Pixel ${hover.x}, ${hover.y} · ` : '') + 'Clic para pintar · mantén Espacio y mueve el mouse');
}

// ---- Paleta ----
const pal = document.getElementById('palette');

function selectColor(c) {
  color = c;
  pal.querySelectorAll('.sw').forEach(e => e.classList.toggle('sel', !e.classList.contains('tool') && e.dataset.c === String(c)));
  // elegir un color de la paleta desactiva "pintar con la plantilla"
  if (tpl.use) { tpl.use = false; $('tplUse').checked = false; saveTpl(); }
}

function makeSwatch(c, custom) {
  const b = document.createElement('button');
  b.className = 'sw' + (c ? '' : ' erase') + (custom ? ' custom' : '');
  b.dataset.c = String(c);
  if (c) b.style.background = c;
  b.title = c ? c + (custom ? ' (cuentagotas · clic derecho para quitar)' : '') : 'Borrar';
  b.onclick = () => selectColor(c);
  if (custom) b.oncontextmenu = e => {
    e.preventDefault();
    customColors = customColors.filter(x => x !== c);
    saveCustom(); renderPalette();
    if (color === c) selectColor(COLORS[0]);
  };
  return b;
}

function saveCustom() {
  try { localStorage.setItem(CUSTOM_KEY, JSON.stringify(customColors)); } catch (e) {}
}

const dropper = document.createElement('button');
dropper.className = 'sw tool';
dropper.title = 'Cuentagotas (tecla I): toma un color de la plantilla';
dropper.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m2 22 1-1h3l9-9"/><path d="M3 21v-3l9-9"/><path d="m15 6 3.4-3.4a2.1 2.1 0 1 1 3 3L18 9l.4.4a2.1 2.1 0 1 1-3 3l-3.8-3.8a2.1 2.1 0 1 1 3-3l.4.4Z"/></svg>';
dropper.onclick = () => setPicking(!picking);

function renderPalette() {
  pal.innerHTML = '';
  pal.appendChild(dropper);
  COLORS.forEach(c => pal.appendChild(makeSwatch(c, false)));
  if (customColors.length) {
    const s = document.createElement('div'); s.className = 'sep'; pal.appendChild(s);
    customColors.forEach(c => pal.appendChild(makeSwatch(c, true)));
  }
  pal.querySelectorAll('.sw').forEach(e => e.classList.toggle('sel', !e.classList.contains('tool') && e.dataset.c === String(color)));
}

function setPicking(on) {
  picking = on;
  if (on) tpl.placing = false;
  dropper.classList.toggle('on', on);
  document.getElementById('map').classList.toggle('picking', on);
  if (typeof syncUI === 'function') syncUI();
  updateInfo(); draw();
}

// Color bajo el cursor: primero la plantilla, si no, el pixel ya pintado
function pickColorAt(cell) {
  return tplColor(cell) || pixels.get(cell.x + ',' + cell.y) || null;
}

function pickAt(cell) {
  const c = pickColorAt(cell);
  setPicking(false);
  if (!c) { setInfo('No hay color en ese pixel'); return; }
  if (!COLORS.includes(c)) {
    customColors = [c, ...customColors.filter(x => x !== c)].slice(0, 16);
    saveCustom(); renderPalette();
  }
  selectColor(c);
  setInfo('Color tomado: ' + c);
}

renderPalette();

// ---- Plantilla ----
const $ = id => document.getElementById(id);
const panel = $('tpl');

function saveTpl() {
  try {
    if (!tpl.src) { localStorage.removeItem(TPL_KEY); return; }
    localStorage.setItem(TPL_KEY, JSON.stringify({
      src: tpl.src, x: tpl.x, y: tpl.y, w: tpl.w,
      opacity: tpl.opacity, visible: tpl.visible, use: tpl.use, showMissing: tpl.showMissing
    }));
  } catch (e) { /* imagen muy grande para localStorage: solo dura esta sesion */ }
}

// Reescala la imagen original al ancho pedido (1 px = 1 pixel del mapa)
function buildTpl(width) {
  const img = tpl.img;
  tpl.w = Math.max(1, Math.min(2000, Math.round(width)));
  tpl.h = Math.max(1, Math.round(img.naturalHeight * tpl.w / img.naturalWidth));
  const c = document.createElement('canvas');
  c.width = tpl.w; c.height = tpl.h;
  const cx = c.getContext('2d', { willReadFrequently: true });
  cx.imageSmoothingEnabled = tpl.w < img.naturalWidth;   // suaviza solo al reducir
  cx.imageSmoothingQuality = 'high';
  cx.drawImage(img, 0, 0, tpl.w, tpl.h);
  tpl.canvas = c;
  tpl.data = cx.getImageData(0, 0, tpl.w, tpl.h).data;
  // color hex de cada pixel (null = transparente)
  const d = tpl.data;
  tpl.hex = new Array(tpl.w * tpl.h);
  for (let j = 0; j < tpl.hex.length; j++) {
    const i = j * 4;
    tpl.hex[j] = d[i + 3] < 128 ? null
      : '#' + ((1 << 24) | (d[i] << 16) | (d[i + 1] << 8) | d[i + 2]).toString(16).slice(1);
  }
  tpl.lastGo = null;
  tplVer++;
  $('tplW').value = tpl.w;
  $('tplH').textContent = '× ' + tpl.h;
}

function syncUI() {
  panel.classList.toggle('has', !!tpl.canvas);
  $('tplOp').value = tpl.opacity;
  $('tplShow').textContent = tpl.visible ? 'Ocultar' : 'Mostrar';
  $('tplMove').classList.toggle('on', tpl.placing);
  $('tplUse').checked = tpl.use;
  $('tplMiss').checked = tpl.showMissing;
}

function loadImage(src, cb) {
  const img = new Image();
  img.onload = () => cb(img);
  img.onerror = () => setInfo('No se pudo leer la imagen');
  img.src = src;
}

$('tplFile').onchange = e => {
  const f = e.target.files[0];
  if (!f) return;
  const reader = new FileReader();
  reader.onload = () => loadImage(reader.result, img => {
    tpl.img = img;
    buildTpl(Math.min(img.naturalWidth, 200));
    // guarda la version reescalada (mas ligera) y la centra en la vista
    tpl.src = tpl.canvas.toDataURL('image/png');
    const c = toCell(map.getCenter());
    tpl.x = c.x - Math.floor(tpl.w / 2); tpl.y = c.y - Math.floor(tpl.h / 2);
    tpl.visible = true;
    if (map.getZoom() < MIN_PAINT - 1) map.setZoom(MIN_PAINT - 1);
    saveTpl(); syncUI(); draw(); loadTplArea();
  });
  reader.readAsDataURL(f);
  e.target.value = '';
};

$('tplW').onchange = e => {
  if (!tpl.img) return;
  buildTpl(+e.target.value || tpl.w);
  tpl.src = tpl.canvas.toDataURL('image/png');
  saveTpl(); draw(); loadTplArea();
};
$('tplMiss').onchange = e => { tpl.showMissing = e.target.checked; tpl.visible = true; saveTpl(); syncUI(); draw(); };
$('tplNext').onclick = goToMissing;
$('tplAuto').onclick = autoPaint;
$('tplOp').oninput = e => { tpl.opacity = +e.target.value; saveTpl(); draw(); };
$('tplShow').onclick = () => { tpl.visible = !tpl.visible; saveTpl(); syncUI(); draw(); };
$('tplMove').onclick = () => { if (picking) setPicking(false); tpl.placing = !tpl.placing; syncUI(); updateInfo(); draw(); };
$('tplUse').onchange = e => { tpl.use = e.target.checked; saveTpl(); };
$('tplDel').onclick = () => {
  if (!confirm('¿Quitar la plantilla? (los pixeles pintados se quedan)')) return;
  Object.assign(tpl, { src: null, img: null, canvas: null, data: null, hex: null, placing: false, use: false });
  saveTpl(); syncUI(); updateInfo(); draw();
};

// Restaurar plantilla guardada
try {
  const saved = JSON.parse(localStorage.getItem(TPL_KEY) || 'null');
  if (saved && saved.src) {
    loadImage(saved.src, img => {
      tpl.img = img; tpl.src = saved.src;
      Object.assign(tpl, { x: saved.x, y: saved.y, opacity: saved.opacity ?? 0.5,
                           visible: saved.visible !== false, use: !!saved.use,
                           showMissing: !!saved.showMissing });
      buildTpl(saved.w || img.naturalWidth);
      syncUI(); draw(); loadTplArea();
    });
  }
} catch (e) {}
syncUI();

// ---- Eventos ----
map.on('click', e => {
  if (picking) { pickAt(toCell(e.latlng)); return; }
  if (tpl.placing) {
    const c = toCell(e.latlng);
    tpl.x = c.x; tpl.y = c.y; tpl.placing = false; tpl.visible = true; tpl.lastGo = null;
    saveTpl(); syncUI(); updateInfo(); draw(); loadTplArea();
    return;
  }
  if (map.getZoom() < MIN_PAINT) { map.setView(e.latlng, MIN_PAINT + 1); return; }
  paint(toCell(e.latlng));
});
// Pinta todos los pixeles entre el ultimo y el actual (para que no queden huecos)
function strokeTo(cell) {
  if (map.getZoom() < MIN_PAINT || tpl.placing) return;
  if (!lastCell) { paint(cell); lastCell = cell; return; }
  let x0 = lastCell.x, y0 = lastCell.y;
  const x1 = cell.x, y1 = cell.y;
  const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0);
  const sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  let err = dx + dy;
  while (x0 !== x1 || y0 !== y1) {
    const e2 = 2 * err;
    if (e2 >= dy) { err += dy; x0 += sx; }
    if (e2 <= dx) { err += dx; y0 += sy; }
    paint({ x: x0, y: y0 });
  }
  lastCell = cell;
}

function stopStroke() {
  spaceDown = false;
  lastCell = null;
  updateInfo();
}

map.on('mousemove', e => {
  hover = toCell(e.latlng);
  if (spaceDown) strokeTo(hover);
  draw(); updateInfo();
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && picking) { setPicking(false); return; }
  if (e.key === 'Escape' && tpl.placing) { tpl.placing = false; syncUI(); updateInfo(); draw(); return; }
  if (e.target.matches && e.target.matches('input[type=number]')) return;
  if ((e.key === 'i' || e.key === 'I') && !e.ctrlKey && !e.metaKey) { setPicking(!picking); return; }
  if (e.code !== 'Space') return;
  if (picking) { e.preventDefault(); return; }
  e.preventDefault();               // evita que Espacio active un boton
  if (e.repeat || spaceDown) return;
  spaceDown = true;
  lastCell = null;
  if (hover) strokeTo(hover);
  updateInfo();
});
document.addEventListener('keyup', e => { if (e.code === 'Space') stopStroke(); });
window.addEventListener('blur', stopStroke);
map.on('mouseout', () => { hover = null; draw(); });
map.on('move', draw);
map.on('zoomstart', () => { canvas.style.visibility = 'hidden'; });
map.on('zoomend', () => { canvas.style.visibility = ''; draw(); updateInfo(); });
map.on('moveend', load);
map.on('resize', resize);

// Evita que los clics en el panel lleguen al mapa
L.DomEvent.disableClickPropagation(panel);
L.DomEvent.disableScrollPropagation(panel);

resize();
load();
updateInfo();
</script>
</body>
</html>
